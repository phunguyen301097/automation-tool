# Cấu hình chung. Chỉ cần ghi những gì muốn thay đổi so với mặc định
# (xem weplan_export/config.py -> DEFAULT_CONFIG để biết đầy đủ).

base_url: https://dashboard.weplananalytics.com
start_path: /app/bi/coverage
output_dir: downloads            # nơi lưu file tải về
run_order: market                # market: xong mọi trang của 1 nước rồi sang nước khác (nghỉ sau mỗi nước)
                                 # page: xong 1 trang cho cả 8 nước rồi sang trang khác

# Biến dùng chung cho mọi file kịch bản.
vars:
  # Thị trường chạy cho mọi KPI: code = mã trong tên file, country = mã quốc gia trong ô chọn
  # quốc gia của dashboard (kh, la, tl, mm, bi, tz, mz, ht). Bỏ / thêm dòng để đổi danh sách.
  markets:
    - {code: VTC, country: kh, name: Cambodia}
    - {code: STL, country: la, name: Laos}
    - {code: VTL, country: tl, name: Timor-Leste}
    - {code: MYN, country: mm, name: Myanmar}
    - {code: VTB, country: bi, name: Burundi}
    - {code: VTZ, country: tz, name: Tanzania}
    - {code: MVT, country: mz, name: Mozambique}
    - {code: NCM, country: ht, name: Haiti}

auth:
  storage_state: .auth/state.json  # session đăng nhập (tạo bằng lệnh `login`)

browser:
  headless: true                 # true = chạy ẩn, không hiện cửa sổ (thêm --headed để xem)
  isolated: false                # false = mọi scenario dùng chung 1 trang; true = mỗi scenario 1 phiên riêng
  # Dùng Chrome/Edge đã cài sẵn trên máy thay vì Chromium của Playwright:
  # channel: chrome             # hoặc msedge
  slow_mo: 0

timeouts:                        # mili-giây
  default: 30000
  navigation: 90000
  data_load: 300000              # chờ tối đa 5 phút cho data load lên table
  download: 180000

date:
  # Cách chọn khoảng thời gian:
  #   auto     : tự dò (ô nhập -> ô nhập trong popup -> bấm ngày trên lịch). Nên dùng.
  #   input    : gõ "01-09-2026 - 25-09-2026" vào ô date
  #   calendar : bấm ngày bắt đầu / kết thúc trên lịch popup rồi Apply
  mode: auto
  input_format: "dd-MM-yyyy"     # định dạng .NET; dashboard hiển thị 01-09-2026 - 25-09-2026
  range_separator: " - "

throttle:
  # Nghỉ giữa các lần xuất (giây). Ghi 1 số, [min, max] (ngẫu nhiên trong khoảng) hoặc 0 để tắt.
  pause_between: [30, 60]        # nghỉ giữa 2 kịch bản (2 lần xuất)
  pause_between_steps: [2, 5]    # nghỉ giữa các step trong 1 lần xuất (chọn ngày, filter, view, download...)
  pause_after_market: [300, 600] # xong 1 thị trường thì nghỉ 5-10 phút (dùng cùng run_order: market)
  max_exports: 0                 # xuất đủ N file thì dừng, hôm sau chạy lại với --resume (0 = không giới hạn)

popups:
  auto_dismiss: true             # tự đóng popup thông báo (What's New...) chặn trang

selectors:
  # Chỉnh ở đây nếu giao diện web thay đổi.
  datepicker_input: "#datepicker input"
  table_container: "#tableProvinces"
  table_rows: "#tableProvinces table tbody tr"
  download_button_text: "Download table"
