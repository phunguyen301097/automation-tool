<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mock dashboard</title>
<!-- Minimal imitation of the Weplan dashboard DOM, used by the tests. -->
<style>
  .d-none { display: none !important; }
  .mm-collapse { display: none; }
  .mm-show { display: block; }
  .dropdown-menu { display: none; border: 1px solid #ccc; }
  .dropdown-menu.show { display: block; }
  #calendar { display: none; }
  body { display: flex; font-family: sans-serif; }
  aside { width: 240px; }
</style>
<script>var dateLimits = {"maxDate":"20260923","minDate":"20250923","dayLag":2};</script>
</head>
<body class="dashboard">
<div id="app" style="display:flex">
<aside class="navbar-default dash-sidebar sidebar-common">
  <ul class="side-menu metismenu">
    <li><a href="/app/bi/coverage"><div>Coverage time</div></a></li>
    <li><a class="has-arrow" href="#"><div>Signal &amp; Quality</div></a>
      <ul class="mm-collapse">
        <li><a href="/app/bi/signal"><div>Average signal level</div></a></li>
      </ul>
    </li>
    <li><a class="has-arrow" href="#"><div>Latency</div></a>
      <ul class="mm-collapse">
        <li><a href="/app/bi/latencyMobile"><div>Latency Mobile (Cellular)</div></a></li>
        <li><a href="/app/bi/latencyWifi"><div>Latency Fixed (Wi-Fi)</div></a></li>
      </ul>
    </li>
    <li><a class="has-arrow" href="#"><div>Throughput</div></a>
      <ul class="mm-collapse">
        <li><a href="/app/bi/globalThroughputNetwork"><div>Mobile (Cellular)</div></a></li>
      </ul>
    </li>
  </ul>
</aside>
<div id="dash">
  <h1 id="kpiTitle"></h1>
  <select class="selectpicker country-switcher" id="dropdownCountryChooser">
    <option value="bi">Burundi</option><option value="kh">Cambodia</option><option value="ht">Haiti</option>
  </select>
  <div id="basicFiltersRow">
    <div id="datepicker"><input type="text" class="p-inputtext"></div>
    <select id="carrier_filter" class="selectpicker basicFilter" multiple></select>
    <select id="coverage_filter" class="selectpicker basicFilter" multiple>
      <option value="5G_SA">5G_SA</option><option value="5G_NSA_CONNECTED">5G_NSA_CONNECTED</option>
      <option value="5G_NSA_NOT_RESTRICTED">5G_NSA_NOT_RESTRICTED</option><option value="5G_NSA_RESTRICTED">5G_NSA_RESTRICTED</option>
      <option value="4G">4G</option><option value="3G">3G</option><option value="2G">2G</option>
      <option value="LIMITED">Limited</option><option value="NO_SIGNAL">No signal</option>
    </select>
    <select id="origin_filter" class="selectpicker basicFilter" multiple>
      <option value="Viettel">Viettel</option><option value="Weplan">Weplan</option>
    </select>
    <div class="form-group"><label class="col-12 p-0" for="technology_filter">Technology</label>
      <select id="technology_filter" class="selectpicker basicFilter" multiple>
        <option value="NR">NR</option><option value="LTE">LTE</option><option value="UMTS">UMTS</option><option value="GSM">GSM</option>
      </select></div>
    <div class="form-group"><label class="col-12 p-0"><i class="fa fa-star"></i> Mobile Quality Score <span>(1 active)</span></label>
      <select class="selectpicker basicFilter" multiple>
        <option value="excellent" selected>Excellent</option><option value="sufficient">Sufficient</option><option value="insufficient">Insufficient</option>
      </select></div>
    <select id="dimension_filter" class="selectpicker basicFilter">
      <option value="request_time">3. Request time (Time to first byte) (ms)</option><option value="duration">7. Total loading time (ms)</option>
      <option value="start_time">Video start time (s)</option><option value="buffer_time">Video stall/buffer time (s)</option>
    </select>
    <select class="form-control selectpicker" id="group_selector">
      <option value="all">All</option><option value="carrier">Cellular network</option>
    </select>
  </div>
  <div id="updateButtonRow" class="d-none"><button id="updateButton">Parameters changed. Click here to execute new query</button></div>
  <div id="errors_row" class="d-none"><h5 id="error_message"></h5></div>
  <div id="placeholder-row">
    <a href="#" class="chartModeSelector" id="byCountry"><div class="card-footer">Macro data</div></a>
    <a href="#" class="chartModeSelector" id="byRegions"><div class="card-footer">By provinces</div></a>
    <div class="panelLoader d-none" id="loader">Loading...</div>
  </div>
  <div id="results" class="d-none">
    <div class="btn-group"><button type="button">Download graph</button>
      <div class="dropdown-menu"><a class="dropdown-item" href="#">As PNG</a><a class="dropdown-item" href="#">As PDF</a></div>
    </div>
    <div id="tableProvinces">
      <div class="btn-group">
        <button type="button" id="dlBtn"><i class="fa fa-download"></i> Download table</button>
        <div class="dropdown-menu" id="dlMenu">
          <a class="dropdown-item" href="#" data-format="xlsx">As XLSX</a>
          <a class="dropdown-item" href="#" data-format="json">As JSON</a>
          <a class="dropdown-item" href="#" data-format="csv">As CSV</a>
        </div>
      </div>
      <table><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>
</div>
<div id="changelogAnnouncer"></div>
<script>
const params = new URLSearchParams(location.search);
// "What's New" announcement like the dashboard's #changelogAnnouncer.
//   ?announce=1     : shows ~1.5 s after each page load until closed (close = seen, stored).
//   ?announce=stuck : the close button does nothing (tests the forced removal).
if (params.get('announce')) sessionStorage.setItem('announce', params.get('announce'));
const announce = sessionStorage.getItem('announce');
if (announce && localStorage.getItem('changelogSeen') !== 'delta') setTimeout(() => {
  document.getElementById('changelogAnnouncer').innerHTML =
    '<div class="modal fade show" role="dialog" style="display:block;position:fixed;inset:0;z-index:1050">' +
    '<div class="modal-dialog" style="margin:80px auto;width:420px;background:#fff;padding:12px">' +
    '<div class="modal-content"><div class="modal-header"><h5>New Delta Analysis in Map View</h5>' +
    '<button type="button" class="btn-close" aria-label="Close">×</button></div>' +
    '<div class="modal-body">Compare two periods on the map.</div></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal-backdrop show" style="position:fixed;inset:0;z-index:1040;background:rgba(0,0,0,.4)"></div>');
  document.body.classList.add('modal-open');
  document.querySelector('#changelogAnnouncer .btn-close').onclick = () => {
    if (announce === 'stuck') return;
    localStorage.setItem('changelogSeen', 'delta');
    document.getElementById('changelogAnnouncer').innerHTML = '';
    document.querySelector('.modal-backdrop').remove();
    document.body.classList.remove('modal-open');
  };
}, 1500);
// The dashboard remembers the chosen country across pages.
const country = params.get('country') || sessionStorage.getItem('country') || 'bi';
sessionStorage.setItem('country', country);
const carriers = {bi: ['ECONET', 'LUMITEL', 'ONAMOB', 'SMART'], kh: ['CELLCARD', 'METFONE', 'SMART'], ht: ['DIGICEL', 'NATCOM']};
const $ = s => document.querySelector(s);
document.getElementById('kpiTitle').textContent = location.pathname;
$('#dropdownCountryChooser').value = country;
// Carrier options arrive asynchronously, like the real dashboard.
setTimeout(() => {
  for (const c of carriers[country]) $('#carrier_filter').add(new Option(c, c));
}, 700);

document.querySelectorAll('a.has-arrow').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); a.nextElementSibling.classList.toggle('mm-show');
}));
// Like the dashboard: switching country calls an endpoint (its navigation is aborted:
// net::ERR_ABORTED), then reloads the same page.
$('#dropdownCountryChooser').addEventListener('change', e => {
  sessionStorage.setItem('country', e.target.value);
  location.href = '/switch-country?country=' + e.target.value;   // 204 -> ERR_ABORTED
  setTimeout(() => location.reload(), 600);
});

let dateRange = null;
// Date widget variants (?dp=...):
//   (default) like the real dashboard (see the recorded video): text "27-08-2026 - 23-09-2026";
//             click opens two month calendars ("Aug" "2026" | "Sep" "2026", < and > arrows,
//             Monday first, days after max struck through, presets on the left). Picking the
//             start and end day applies and closes. Class names deliberately match no library.
//   drp     : daterangepicker (two months + Apply button).
//   input   : a text input taking "dd-mm-yyyy - dd-mm-yyyy" + Enter.
//   popup   : text; click opens a popup with start/end inputs.
//   none    : text; nothing usable opens.
const dpMode = params.get('dp') || 'real';
const pad = n => String(n).padStart(2, '0');
const dmy = d => `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`;
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDmy = v => { const m = v.trim().match(/^(\d\d)-(\d\d)-(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const maxDate = new Date(2026, 8, 23);
function setRange(a, b) { dateRange = `${a}..${b}`; markChanged(); }
const e2dmy = iso => iso.split('-').reverse().join('-');
const DAY_NAMES = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
function openRealPicker() {
  const root = $('#datepicker');
  let view = new Date(2026, 7, 1), start = null;  // left month = Aug 2026
  const pop = document.createElement('div');
  pop.className = 'x9k-pop';
  pop.style.cssText = 'position:absolute;background:#fff;border:1px solid #ccc;display:flex;padding:6px;z-index:10';
  root.appendChild(pop);
  const MON = d => d.toLocaleString('en-US', {month: 'short'});
  const cell = 'display:inline-block;width:28px;text-align:center;padding:4px 0;cursor:pointer';
  function month(first, side) {
    let h = `<div class="q1"><div class="q2" style="display:flex;gap:12px;align-items:center;padding:4px">` +
      (side === 'left' ? '<button class="q3a" style="width:24px">&lt;</button>' : '<span style="width:24px"></span>') +
      `<span class="q4">${MON(first)}</span><span class="q5">${first.getFullYear()}</span>` +
      (side === 'right' ? '<button class="q3b" style="width:24px">&gt;</button>' : '<span style="width:24px"></span>') +
      '</div><div>' + DAY_NAMES.map(n => `<span style="${cell}">${n}</span>`).join('') + '</div>';
    const d = new Date(first); d.setDate(1 - ((first.getDay() + 6) % 7));
    for (let i = 0; i < 42; i++) {
      if (i % 7 === 0) h += '<div>';
      const other = d.getMonth() !== first.getMonth(), after = d > maxDate;
      const style = cell + (other ? ';color:#bbb' : '') + (after ? ';text-decoration:line-through' : '');
      h += `<span class="q6" style="${style}" data-d="${isoOf(d)}" data-ok="${!other && !after}">${d.getDate()}</span>`;
      if (i % 7 === 6) h += '</div>';
      d.setDate(d.getDate() + 1);
    }
    return h + '</div>';
  }
  function render() {
    pop.innerHTML = '<div class="q7" style="display:flex;flex-direction:column;padding-right:8px">' +
      ['Last 7 days', 'Last 30 days', 'Current month', 'Last month'].map(t => `<span class="q8">${t}</span>`).join('') +
      '</div>' + month(view, 'left') + month(new Date(view.getFullYear(), view.getMonth() + 1, 1), 'right');
    pop.querySelectorAll('.q8').forEach(p => p.onclick = e => {
      e.stopPropagation();
      if (p.textContent !== 'Last month') return;
      const now = new Date(), a = new Date(now.getFullYear(), now.getMonth() - 1, 1), b = new Date(now.getFullYear(), now.getMonth(), 0);
      setRange(isoOf(a), isoOf(b));
      $('#datepicker span').textContent = `${dmy(a)} - ${dmy(b)}`;
      pop.remove();
    });
    pop.querySelector('.q3a').onclick = e => { e.stopPropagation(); view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
    pop.querySelector('.q3b').onclick = e => { e.stopPropagation(); view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
    pop.querySelectorAll('.q6').forEach(c => c.onclick = e => {
      e.stopPropagation();
      if (c.dataset.ok !== 'true') return;
      if (!start) { start = c.dataset.d; c.style.background = '#2a7ab8'; return; }
      const [a, b] = [start, c.dataset.d].sort();
      setRange(a, b);
      $('#datepicker span').textContent = `${e2dmy(a)} - ${e2dmy(b)}`;
      pop.remove();
    });
  }
  render();
}

if (dpMode === 'input') {
  $('#datepicker').innerHTML = '<input type="text" class="form-control" value="01-09-2026 - 23-09-2026">';
  $('#datepicker input').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const [a, b] = e.target.value.split(' - ').map(parseDmy);
    if (a && b) setRange(a, b); else { e.target.value = ''; dateRange = null; }
  });
} else {
  $('#datepicker').innerHTML = '<div class="form-control reportrange-text"><span>27-08-2026 - 23-09-2026</span></div>';
  const text = $('#datepicker span');
  $('#datepicker .reportrange-text').addEventListener('click', () => {
    if ($('.daterangepicker') || $('.x9k-pop') || dpMode === 'none') return;
    if (dpMode === 'popup') {
      document.body.insertAdjacentHTML('beforeend',
        '<div class="daterangepicker"><input name="start"><input name="end"></div>');
      $('.daterangepicker input[name=end]').addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const a = parseDmy($('.daterangepicker input[name=start]').value), b = parseDmy(e.target.value);
        if (a && b) { setRange(a, b); text.textContent = `${e2dmy(a)} - ${e2dmy(b)}`; $('.daterangepicker').remove(); }
      });
      return;
    }
    if (dpMode === 'real') { openRealPicker(); return; }
    // daterangepicker: left month shows `view`, right month shows view + 1.
    let view = new Date(2026, 8, 1), start = null, end = null;
    const pop = document.createElement('div');
    pop.className = 'daterangepicker show-calendar';
    document.body.appendChild(pop);
    const monthName = d => d.toLocaleString('en-US', {month: 'short'}) + ' ' + d.getFullYear();
    function calendar(side, first) {
      let html = `<div class="drp-calendar ${side}"><table><thead><tr>` +
        (side === 'left' ? '<th class="prev available">&lt;</th>' : '<th></th>') +
        `<th class="month">${monthName(first)}</th>` +
        (side === 'right' ? '<th class="next available">&gt;</th>' : '<th></th>') + '</tr></thead><tbody><tr>';
      const d = new Date(first); d.setDate(1 - first.getDay());
      for (let i = 0; i < 42; i++) {
        const off = d.getMonth() !== first.getMonth(), disabled = d > maxDate;
        const cls = off || disabled ? 'off' + (disabled ? ' disabled' : '') : 'available';
        html += `<td class="${cls}" data-date="${isoOf(d)}">${d.getDate()}</td>`;
        if (i % 7 === 6) html += '</tr><tr>';
        d.setDate(d.getDate() + 1);
      }
      return html + '</tr></tbody></table></div>';
    }
    function render() {
      pop.innerHTML = calendar('left', view) + calendar('right', new Date(view.getFullYear(), view.getMonth() + 1, 1)) +
        '<div class="drp-buttons"><button class="cancelBtn">Cancel</button><button class="applyBtn">Apply</button></div>';
      pop.querySelector('.prev').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
      pop.querySelector('.next').onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
      pop.querySelectorAll('td.available').forEach(td => td.onclick = () => {
        if (!start || end) { start = td.dataset.date; end = null; } else { end = td.dataset.date; }
      });
      pop.querySelector('.applyBtn').onclick = () => {
        if (start && end) {
          setRange(start, end);
          const f = s => s.split('-').reverse().join('-');
          text.textContent = `${f(start)} - ${f(end)}`;
        }
        pop.remove();
      };
      pop.querySelector('.cancelBtn').onclick = () => pop.remove();
    }
    render();
  });
}

let hasResults = false;
function markChanged() { if (hasResults) $('#updateButtonRow').classList.remove('d-none'); }
document.querySelectorAll('.basicFilter, #group_selector').forEach(s => s.addEventListener('change', markChanged));

function state() {
  const sel = id => Array.from($(id).selectedOptions).map(o => o.value).join('|');
  return {country, date: dateRange, carrier: sel('#carrier_filter'), coverage: sel('#coverage_filter'),
          origin: sel('#origin_filter'), group: $('#group_selector').value, kpi: location.pathname,
          technology: sel('#technology_filter'), dimension: $('#dimension_filter').value, mqs: Array.from(document.querySelectorAll('#basicFiltersRow select:not([id]) option'))
            .filter(o => o.selected).map(o => o.text).join('|')};
}

function runQuery(view) {
  if (!dateRange && !location.pathname.includes('topology')) { $('#errors_row').classList.remove('d-none'); $('#error_message').textContent = 'No date selected'; return; }
  $('#updateButtonRow').classList.add('d-none');
  $('#results').classList.add('d-none');
  $('#loader').classList.remove('d-none');
  setTimeout(() => {
    const st = state();
    const tbody = $('#tableProvinces tbody');
    tbody.innerHTML = '';
    let names = st.carrier ? st.carrier.split('|') : carriers[country];
    if (country === 'ht' && st.coverage && !/4G|3G|2G/.test(st.coverage)) names = [];  // no 5G data in Haiti
    for (const n of names) tbody.insertAdjacentHTML('beforeend', `<tr><td>${n}</td><td>${Math.round(Math.random()*100)}</td></tr>`);
    $('#loader').classList.add('d-none');
    $('#results').classList.remove('d-none');
    hasResults = true;
    window.lastQuery = {...st, view};
  }, 1500);
}
let currentView = null;
document.querySelectorAll('.chartModeSelector').forEach(a => a.addEventListener('click', e => {
  e.preventDefault(); currentView = a.id; runQuery(a.id);
}));
$('#updateButton').addEventListener('click', () => runQuery(currentView));

$('#dlBtn').addEventListener('click', () => $('#dlMenu').classList.toggle('show'));
document.querySelectorAll('#dlMenu a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  $('#dlMenu').classList.remove('show');
  const q = new URLSearchParams({...window.lastQuery, format: a.dataset.format});
  const link = document.createElement('a');
  link.href = '/export?' + q.toString();
  document.body.appendChild(link); link.click(); link.remove();
}));
</script>
</body>
</html>
