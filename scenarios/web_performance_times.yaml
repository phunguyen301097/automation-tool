# Web performance times - Mobile (Cellular): xuất bảng Excel hàng tháng (cùng quy trình với Coverage time).
#
#   Lần 1 - mức toàn mạng (Net):   Macro data
#   Lần 2 - mức tỉnh (Province):   By provinces
#   Mỗi mức 3 công nghệ: All, 5G, 4G  ->  6 file:
#
#     VTB_2026_T8_Web performance times_Net_All        VTB_2026_T8_Web performance times_Province_All
#     VTB_2026_T8_Web performance times_Net_5G         VTB_2026_T8_Web performance times_Province_5G
#     VTB_2026_T8_Web performance times_Net_4G         VTB_2026_T8_Web performance times_Province_4G
#
# Tên file: Mã thị trường_Năm_Tháng_Loại KPI_Mức mạng/tỉnh_Công nghệ
#
# "Shown dimension" (1. Response DNS ... 7. Total loading time) giữ nguyên như dashboard đang chọn.
# Muốn cố định thì bỏ dấu # ở bước dimension_filter bên dưới.
#
# Chạy:  weplan-export run scenarios/web_performance_times.yaml

vars:
  market: VTB
  country: Burundi
  kpi: Web performance times                 # phần "Loại KPI" trong tên file
  page: /app/bi/webPerformanceTimesMobile

scenarios:
  - name: ${market}_${kpi}_${level.name}_${tech.name}
    tags: [web_performance, monthly]
    matrix:
      level:                               # Bước 4
        - {name: Net, view: macro}         #   Macro data
        - {name: Province, view: admin_1}  #   By provinces
      tech:                                # Bước 3: Coverage type
        - name: All
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED, 4G, 3G, 2G]
        - name: 5G
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED]
        - name: 4G
          coverage: [4G]
    steps:
      - open_menu: ${page}
      - select_country: ${country}
      - set_date: {preset: Last month}                          # Bước 1
      - select_filter: {id: carrier_filter, all: true}          # Bước 2: Cellular network -> Select all
      - select_filter: {id: coverage_filter, options: "${tech.coverage}"}   # Bước 3
      # - select_filter: {id: dimension_filter, options: ["7. Total loading time (ms)"]}
      - choose_view: ${level.view}                              # Bước 4
      - wait_for_table: {}
      - download_table:                                         # Bước 5, 6, 7: Download table -> As XLSX
          format: xlsx
          filename: "${market}_${year}_T${month}_${kpi}_${level.name}_${tech.name}"
