# Speed test > Mobile (Cellular) > Throughput  (6 file mỗi thị trường, theo Weplan_export.docx)
#
#   Chạy cho mọi thị trường trong config.yaml (vars.markets): VTC, STL, VTL, MYN, VTB, VTZ, MVT, NCM
#   Lần 1 - mức toàn mạng (Net): Macro data      Lần 2 - mức tỉnh (Province): By provinces
#
#     VTB_2026_T8_Speed test_Net_All               VTB_2026_T8_Speed test_Province_All
#     VTB_2026_T8_Speed test_Net_5G                VTB_2026_T8_Speed test_Province_5G
#     VTB_2026_T8_Speed test_Net_4G                VTB_2026_T8_Speed test_Province_4G
#
# Tên file: Mã thị trường_Năm_Tháng_Loại KPI_Mức mạng/tỉnh_Công nghệ, lưu trong downloads/<mã thị trường>/
#
# Chạy:  weplan-export run scenarios/speed_test.yaml
#        weplan-export run scenarios/speed_test.yaml -k "VTC_*"     (chỉ một thị trường)

vars:
  kpi: Speed test
  page: speedTestThruMobile                  # trang: /app/<mã quốc gia>/speedTestThruMobile

scenarios:
  - name: ${market.code}_${kpi}_${level.name}_${tech.name}
    tags: [speed_test, monthly]
    matrix:
      market: "${markets}"               # mọi thị trường trong config.yaml
      level:                               # Mức: toàn mạng / tỉnh
        - {name: Net, view: macro}         #   Macro data
        - {name: Province, view: admin_1}  #   By provinces
      tech:                                # Coverage type
        - name: All
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED, 4G, 3G, 2G]
        - name: 5G
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED]
        - name: 4G
          coverage: [4G]
    steps:
      - open_menu: /app/${market.country}/${page}            # mã quốc gia nằm trong URL (vd /app/kh/...)
      - select_country: ${market.country}                     # kiểm tra / chọn đúng quốc gia
      - set_date: {preset: Last month}                          # chọn Date: Last month
      - select_filter: {id: carrier_filter, all: true}          # Cellular network: Select all
      - select_filter: {id: coverage_filter, options: "${tech.coverage}"}   # Coverage type
      - choose_view: ${level.view}                              # Macro data / By provinces
      - wait_for_table: {}
      - download_table:                                         # Download table -> As XLSX
          format: xlsx
          filename: "${market.code}/${market.code}_${year}_T${month}_${kpi}_${level.name}_${tech.name}"
