# Video Streaming > Mobile (Cellular) > Times  (6 file, theo Weplan_export.docx)
#
#   Lần 1 - mức toàn mạng (Net): Macro data      Lần 2 - mức tỉnh (Province): By provinces
#
#     VTB_2026_T8_Video Start time_Net_All         VTB_2026_T8_Video Start time_Province_All
#     VTB_2026_T8_Video Start time_Net_5G          VTB_2026_T8_Video Start time_Province_5G
#     VTB_2026_T8_Video Start time_Net_4G          VTB_2026_T8_Video Start time_Province_4G
#
# Tên file: Mã thị trường_Năm_Tháng_Loại KPI_Mức mạng/tỉnh_Công nghệ
#
# "Shown dimension" cố định là "Video start time (s)" theo tên file trong kịch bản.
#
# Chạy:  python -m weplan_export run scenarios/video_streaming.yaml

vars:
  market: VTB
  country: Burundi
  kpi: Video Start time
  page: /app/bi/youtubeTimesMobile

scenarios:
  - name: ${market}_${kpi}_${level.name}_${tech.name}
    tags: [video_streaming, monthly]
    matrix:
      level:                               # Mức: toàn mạng / tỉnh
        - {name: Net, view: macro}         #   Macro data
        - {name: Province, view: admin_1}  #   By provinces
      tech:                                # Coverage type
        - name: All
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED, 4G, 3G, 2G]
        - name: 5G
          coverage: [5G_SA, 5G_NSA_CONNECTED, 5G_NSA_NOT_RESTRICTED, 5G_NSA_RESTRICTED]
        - name: 4G
          coverage: [4G]
    steps:
      - open_menu: ${page}
      - select_country: ${country}
      - set_date: {preset: Last month}                          # chọn Date: Last month
      - select_filter: {id: carrier_filter, all: true}          # Cellular network: Select all
      - select_filter: {id: coverage_filter, options: "${tech.coverage}"}   # Coverage type
      - select_filter: {id: dimension_filter, options: ["Video start time (s)"]}  # Shown dimension
      - choose_view: ${level.view}                              # Macro data / By provinces
      - wait_for_table: {}
      - download_table:                                         # Download table -> As XLSX
          format: xlsx
          filename: "${market}_${year}_T${month}_${kpi}_${level.name}_${tech.name}"
